name: CI

on:
  push:
    branches:
      - main
      - refactor/final-hardening

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_support_test
      LLM_PROVIDER: mock
      DEBUG: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock file
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run tests
        run: |
          uv run --locked python -m pytest \
            --cov=app \
            --cov-report=term-missing

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest

    env:
      AUTH_MODE: jwt
      JWT_ALGORITHM: HS256
      JWT_SECRET: ci-secret-that-is-long-enough-for-hs256
      JWT_ISSUER: ai-support-platform
      JWT_AUDIENCE: ai-support-api
      RATE_LIMIT_REQUESTS: 2
      RATE_LIMIT_WINDOW_SECONDS: 3600

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up -d --build --wait

      - name: Show service status
        run: docker compose ps -a

      - name: Check API health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8000/api/health

      - name: Check database health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8000/api/db

      - name: Check API readiness
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8000/api/ready

      - name: Run knowledge-base ingestion
        run: |
          docker compose run --rm api \
            python -m scripts.ingest

      - name: Verify idempotent ingestion
        run: |
          output="$(
            docker compose run --rm api \
              python -m scripts.ingest
          )"

          echo "$output"

          echo "$output" |
            grep -F \
              "Knowledge base is already up to date."

      - name: Run chat flow
        run: |
          token="$(
            docker compose run --rm --no-deps api \
              python -m scripts.create_dev_token \
              --subject smoke-user \
              --minutes 5
          )"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --url http://localhost:8000/api/smoke-session \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $token" \
            --data '{"message":"How can I change my card PIN?"}' |
            python -c 'import json, sys; payload = json.load(sys.stdin); assert payload["session_id"] == "smoke-session"; assert payload["reply"].startswith("Mock provider is active.")'

      - name: Verify persisted conversation
        run: |
          token="$(
            docker compose run --rm --no-deps api \
              python -m scripts.create_dev_token \
              --subject smoke-user \
              --minutes 5
          )"

          curl \
            --fail \
            --silent \
            --show-error \
            --header "Authorization: Bearer $token" \
            http://localhost:8000/api/smoke-session/history |
            python -c 'import json, sys; payload = json.load(sys.stdin); assert len(payload["messages"]) == 1; assert payload["messages"][0]["user_message"] == "How can I change my card PIN?"'

      - name: Verify chat rate limit
        run: |
          token="$(
            docker compose run --rm --no-deps api \
              python -m scripts.create_dev_token \
              --subject smoke-user \
              --minutes 5
          )"

          second_status="$(
            curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --request POST \
              --url http://localhost:8000/api/smoke-session \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer $token" \
              --data '{"message":"Second request"}'
          )"

          limited_status="$(
            curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --request POST \
              --url http://localhost:8000/api/smoke-session \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer $token" \
              --data '{"message":"Rate-limited request"}'
          )"

          test "$second_status" = "200"
          test "$limited_status" = "429"

      - name: Show Docker logs
        if: always()
        run: |
          docker compose logs \
            --no-color \
            --tail=200 \
            db redis migrate api

      - name: Stop services
        if: always()
        run: |
          docker compose down \
            -v \
            --remove-orphans
